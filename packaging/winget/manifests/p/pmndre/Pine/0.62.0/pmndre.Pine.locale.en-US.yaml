ShortDescription: The desktop app for pine, an event-driven multi-agent daemon.
Description: |-
  Pine is the desktop app for pine, a reactive harness for agents: an event-driven daemon that runs
  several AI agents, wakes them on events from outside (mail, chat, webhooks, schedules, devices)
  and keeps each one in a sandbox. The app carries pine and the Node it runs on, and puts `pine`
  on your PATH for a terminal.
